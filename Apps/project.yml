# Generate Bento.xcodeproj with `xcodegen` (brew install xcodegen) from this directory.
name: Bento
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
configFiles:
  Debug: Config/Bento.xcconfig
  Release: Config/Bento.xcconfig
packages:
  BentoData:
    path: ../Packages/BentoData
  BentoUI:
    path: ../Packages/BentoUI
targets:
  Bento:
    type: application
    platform: macOS
    sources:
      - path: Bento
        excludes:
          - LaunchAgents
    dependencies:
      - package: BentoData
      - package: BentoUI
    info:
      path: Bento/Info.plist
      properties:
        CFBundleDisplayName: Bento
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.news
        BentoICloudContainer: $(BENTO_ICLOUD_CONTAINER)
    postCompileScripts:
      - name: Embed bento-collector
        # Always runs: cargo does its own change tracking. Declared outputs make Xcode re-sign
        # the app bundle after the embedded binary changes.
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/bento-collector
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/io.github.alexcding.bento.collector.plist
        script: |
          exec "${SRCROOT}/Scripts/embed-collector.sh"
