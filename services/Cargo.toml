[workspace]
resolver = "3"
members = [
  "crates/bento-domain",
  "crates/bento-app",
  "crates/bento-store-sqlite",
  "crates/bento-source-rss",
  "crates/bento-plugin-host",
  "crates/bento-ai",
  "crates/bento-extract",
  "crates/bento-publish",
  "crates/bento-secrets-keychain",
  "crates/bento-collector",
  "../plugins/bilibili",
  "../plugins/telegram",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/alexcding/Bento"

[workspace.dependencies]
bento-domain = { path = "crates/bento-domain" }
bento-app = { path = "crates/bento-app" }
bento-store-sqlite = { path = "crates/bento-store-sqlite" }
bento-source-rss = { path = "crates/bento-source-rss" }
bento-plugin-host = { path = "crates/bento-plugin-host" }
bento-ai = { path = "crates/bento-ai" }
bento-extract = { path = "crates/bento-extract" }
bento-publish = { path = "crates/bento-publish" }
bento-secrets-keychain = { path = "crates/bento-secrets-keychain" }

anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
dom_smoothie = "0.18.2"
encoding_rs = "0.8.42"
htmd = "0.5.6"
md5 = "0.8.1"
nix = { version = "0.31.3", features = ["signal", "process"] }
feed-rs = "3.0.0"
futures = "0.3.34"
flate2 = "1.1.10"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "json", "query"] }
scraper = "0.27.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_json_path = "0.7.2"
security-framework = "3.7.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wiremock = "0.6.5"
uuid = { version = "1.28.0", features = ["serde", "v5"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
