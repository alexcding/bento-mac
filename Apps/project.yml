# Generate Bento.xcodeproj with `xcodegen` (brew install xcodegen) from this directory.
name: Bento
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
configFiles:
  Debug: Config/Bento.xcconfig
  Release: Config/Bento.xcconfig
packages:
  BentoData:
    path: ../Packages/BentoData
  BentoUI:
    path: ../Packages/BentoUI
targets:
  Bento:
    type: application
    platform: macOS
    sources:
      - path: Bento
        excludes:
          - LaunchAgents
      # Bundled plugins, copied as Contents/Resources/plugins and loaded by bento-collector.
      - path: ../plugins
        type: folder
        buildPhase: resources
    dependencies:
      # The daemon, as a helper app so it can be signed with the keychain access group that puts
      # secrets in iCloud Keychain.
      - target: BentoCollector
        embed: true
        codeSign: false
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - package: BentoData
        product: BentoData
      - package: BentoData
        product: BentoCollectorClient
      - package: BentoUI
    info:
      path: Bento/Info.plist
      properties:
        CFBundleDisplayName: Bento
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.news
        BentoICloudContainer: $(BENTO_ICLOUD_CONTAINER)
    postCompileScripts:
      - name: Embed LaunchAgent
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/com.alexcding.bento.collector.plist
        inputFiles:
          - $(SRCROOT)/Bento/LaunchAgents/com.alexcding.bento.collector.plist
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchAgents"
          cp "${SRCROOT}/Bento/LaunchAgents/com.alexcding.bento.collector.plist" \
            "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchAgents/"
  # bento-collector and the bundled protocol plugins, built by cargo, in a background-only app
  # bundle (Bento.app/Contents/Helpers/BentoCollector.app). It has no Swift sources; the build
  # script puts the Rust binaries in place before Xcode signs the bundle.
  BentoCollector:
    type: application
    platform: macOS
    sources: []
    info:
      path: BentoCollector/Info.plist
      properties:
        CFBundleDisplayName: Bento Collector
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSBackgroundOnly: true
    settings:
      base:
        PRODUCT_NAME: BentoCollector
        EXECUTABLE_NAME: bento-collector
        PRODUCT_BUNDLE_IDENTIFIER: $(BENTO_BUNDLE_ID).collector
        CODE_SIGN_ENTITLEMENTS: $(BENTO_COLLECTOR_ENTITLEMENTS)
        SKIP_INSTALL: YES
    postCompileScripts:
      - name: Build bento-collector
        # Always runs: cargo does its own change tracking. Declared outputs make Xcode sign the
        # bundle after the binaries change.
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/bento-collector
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/bento-plugin-bilibili
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/bento-plugin-telegram
        script: |
          exec "${SRCROOT}/Scripts/embed-collector.sh"
